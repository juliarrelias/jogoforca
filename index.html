<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo da Forca Multiplayer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;--bd:#ddd8cc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--card:#202026;--tx:#f1f1f3;--mu:#9a9aa3;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;--bd:#34343c}}
:root[data-theme="dark"]{--bg:#16161a;--card:#202026;--tx:#f1f1f3;--mu:#9a9aa3;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;--bd:#34343c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0 .6em;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem;margin:4px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:10px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sc{display:flex;gap:8px;flex-wrap:wrap}
.pl{flex:1;min-width:90px;border:2px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.pl.on{border-color:var(--ac)}
.pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl span{font-size:1.4rem;font-weight:700}
.word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.word i{width:34px;height:44px;border-bottom:3px solid var(--tx);font:700 1.7rem/44px system-ui;text-align:center;font-style:normal;text-transform:uppercase}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(40px,1fr));gap:6px}
.kb button{padding:10px 0;font-weight:700;text-transform:uppercase}
.kb .h{background:var(--ok);color:#fff;border-color:var(--ok)}
.kb .m{background:var(--bad);color:#fff;border-color:var(--bad)}
svg{width:170px;height:190px;display:block;margin:0 auto}
svg *{stroke:var(--tx);stroke-width:4;fill:none;stroke-linecap:round}
.msg{text-align:center;font-weight:600;min-height:1.4em}
.mu{color:var(--mu);font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>🪢 Jogo da Forca</h1>
<div id="app"></div>
</main>

"Materiais":`paralelepipedo otorrinolaringologista cachoeira girassol esmeralda diamante rubi safira ouro prata bronze cobre ferro aco aluminio chumbo zinco niquel estanho platina madeira vidro plastico borracha couro papel papelao tecido algodao seda linho la nylon cera argila porcelana ceramica marmore granito`,
"Diversos":`borboleta guarda-sol abecedario alfabeto carnaval chocolate felicidade paciencia biblioteca elefante computador aniversario astronauta dinossauro aquario terrario labirinto caleidoscopio trampolim escorregador gangorra balanco carrossel pipoca algodaodoce picole sorvete balao confete serpentina fantasia mascara brinquedo boneca carrinho bonequinho quebracabeca pelucia massinha pipa bolinha peteca piao ioio`
};
const clean=x=>[...new Set(x.split(/\s+/).map(w=>w.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()).filter(w=>/^[a-z]{4,}$/.test(w)))];
const POOL={};for(const t in THEMES)POOL[t]=clean(THEMES[t]);
const DICT=[...new Set(Object.values(POOL).flat())];
const WT={};for(const t in POOL)POOL[t].forEach(w=>{if(!WT[w])WT[w]=t});
const LET="abcdefghijklmnopqrstuvwxyz".split("");
const MAXERR=6;
let S={phase:"setup",players:[],cur:0,word:"",guessed:new Set(),errs:0,used:new Set(),msg:"",th:"Todos",wt:""};
const $=id=>document.getElementById(id);
const app=$("app");
function pick(){
  const pool=S.th==="Todos"?DICT:POOL[S.th];
  let free=pool.filter(w=>!S.used.has(w));
  if(!free.length){pool.forEach(w=>S.used.delete(w));free=pool;}
  const w=free[Math.floor(Math.random()*free.length)];
  S.used.add(w);S.wt=S.th==="Todos"?WT[w]:S.th;return w;
}
function startGame(){
  const names=[...document.querySelectorAll(".pn")].map(i=>i.value.trim()).filter(Boolean);
  if(!names.length)return;
  S.th=$("th").value;S.players=names.map(n=>({n,s:0}));S.cur=0;newRound();
}
function newRound(){
  S.word=pick();S.guessed=new Set();S.errs=0;S.phase="play";S.msg="";
  render();
}
function guess(l){
  if(S.phase!=="play"||S.guessed.has(l))return;
  S.guessed.add(l);
  const p=S.players[S.cur];
  if(S.word.includes(l)){
    const n=S.word.split("").filter(c=>c===l).length;
    p.s+=n;
    if(S.word.split("").every(c=>S.guessed.has(c))){
      p.s+=5;S.phase="won";S.msg=`🎉 ${p.n} completou a palavra! (+5 bônus)`;
    }else S.msg=`✅ ${p.n} acertou! Joga de novo.`;
  }else{
    S.errs++;
    if(S.errs>=MAXERR){S.phase="lost";S.msg="💀 Enforcados! Ninguém pontua o bônus.";}
    else{S.cur=(S.cur+1)%S.players.length;S.msg=`❌ Errou! Vez de ${S.players[S.cur].n}.`;}
  }
  render();
}
function nextRound(){S.cur=(S.cur+1)%S.players.length;newRound();}
function reset(){S={phase:"setup",players:[],cur:0,word:"",guessed:new Set(),errs:0,used:new Set(),msg:"",th:S.th,wt:""};render();}
function gallows(){
  const parts=['<circle cx="115" cy="55" r="16"/>','<line x1="115" y1="71" x2="115" y2="120"/>','<line x1="115" y1="85" x2="92" y2="105"/>','<line x1="115" y1="85" x2="138" y2="105"/>','<line x1="115" y1="120" x2="95" y2="155"/>','<line x1="115" y1="120" x2="135" y2="155"/>'];
  return `<svg viewBox="0 0 170 190"><line x1="20" y1="180" x2="120" y2="180"/><line x1="45" y1="180" x2="45" y2="15"/><line x1="45" y1="15" x2="115" y2="15"/><line x1="115" y1="15" x2="115" y2="39"/>${parts.slice(0,S.errs).join("")}</svg>`;
}
function render(){
  if(S.phase==="setup"){
    app.innerHTML=`<div class="card"><b>Jogadores (1 a 6)</b><p class="mu">Revezamento no mesmo aparelho. Acertou: joga de novo (+1 ponto por letra). Errou: passa a vez. Completar a palavra vale +5. Os erros são compartilhados: ${MAXERR} e todo mundo perde a rodada.</p>
    ${[1,2,3,4,5,6].map(i=>`<input class="pn" maxlength="14" placeholder="Jogador ${i}${i>1?" (opcional)":""}" value="${i<=2?"Jogador "+i:""}">`).join("")}
    <label class="mu">Tema</label><select id="th"><option value="Todos">🎲 Todos os temas (${DICT.length} palavras)</option>${Object.keys(POOL).map(t=>`<option value="${t}" ${S.th===t?"selected":""}>${t} (${POOL[t].length})</option>`).join("")}</select><button class="p" onclick="startGame()" style="width:100%">Começar</button></div>`;
    return;
  }
  const over=S.phase!=="play";
  const shown=S.word.split("").map(c=>`<i>${S.guessed.has(c)||S.phase==="lost"?c:"&nbsp;"}</i>`).join("");
  app.innerHTML=`<div class="card sc">${S.players.map((p,i)=>`<div class="pl ${i===S.cur&&!over?"on":""}"><b>${p.n}</b><span>${p.s}</span></div>`).join("")}</div>
  <div class="card">${gallows()}<div class="msg" style="color:var(--ac)">Tema: ${S.wt}</div><div class="word">${shown}</div>
  <div class="msg">${S.msg||`Vez de ${S.players[S.cur].n}`}</div>
  <p class="mu" style="text-align:center">Erros: ${S.errs}/${MAXERR} · ${S.word.length} letras</p></div>
  <div class="card"><div class="kb">${LET.map(l=>`<button ${S.guessed.has(l)||over?"disabled":""} class="${S.guessed.has(l)?(S.word.includes(l)?"h":"m"):""}" onclick="guess('${l}')">${l}</button>`).join("")}</div></div>
  <div class="row">${over?`<button class="p" onclick="nextRound()">Próxima palavra</button>`:"<span></span>"}<button onclick="reset()">Novo jogo</button></div>`;
}
document.addEventListener("keydown",e=>{
  if(S.phase!=="play"||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();if(/^[a-z]$/.test(k))guess(k);
});
render();
</script>
</body>
